<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Valuador Inteligente de Bienes Raíces</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h2 class="text-center mb-4">🏠 Sistema Inteligente de Bienes Raíces</h2>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <form action="/predecir_y_guardar" method="post">
                        <div class="mb-3">
                            <label class="form-label">Habitaciones (bed):</label>
                            <input type="number" step="1" name="bed" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Baños (bath):</label>
                            <input type="number" step="0.5" name="bath" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Superficie (house_size en sqft):</label>
                            <input type="number" step="any" name="house_size" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ciudad (city):</label>
                            <input type="text" name="city" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Estado (state):</label>
                            <input type="text" name="state" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Calcular Precio y Guardar en BD</button>
                    </form>
                </div>
            </div>

            {% if precio %}
            <div class="col-md-5">
                <div class="card shadow p-4 bg-white border-success">
                    <h4 class="text-success">📊 Resultados del Análisis</h4>
                    <hr>
                    <p><strong>Precio Estimado (Regresión Lineal):</strong> <span class="fs-4 text-primary">${{ precio }} USD</span></p>
                    <p><strong>Clasificación (Regresión Logística):</strong> <span class="badge bg-info text-dark">{{ categoria }}</span></p>
                    <hr>
                    <p class="text-muted small">{{ db_status }}</p>
                </div>
            </div>
            {% endif %}
            
            {% if error %}
            <div class="col-md-6 mt-3">
                <div class="alert alert-danger">{{ error }}</div>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
